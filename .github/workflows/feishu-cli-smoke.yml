name: Feishu CLI Smoke

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required scripts exist
        run: |
          test -x scripts/check-feishu-cli.sh
          test -f docs/FEISHU_CLI_INTEGRATION.md
          test -f package.json
