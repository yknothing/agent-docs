[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-docs"
version = "0.1.0"
description = "Multi-vendor AI/Agent documentation library: Skills + Workflow control plane with deterministic Python tools."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "yknothing" }]
requires-python = ">=3.10"
keywords = ["agent", "skills", "anthropic", "documentation", "pipeline"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Documentation",
  "Topic :: Software Development :: Documentation",
]
# Runtime: Python stdlib only (intentional, see ARCHITECTURE.md).
# External tools (lark-cli, html2text) are optional and resolved at runtime.
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/yknothing/agent-docs"
Issues = "https://github.com/yknothing/agent-docs/issues"

[project.scripts]
agent-docs = "agent_docs.cli.anthropic:main"
agent-docs-pipeline = "agent_docs.cli.anthropic:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_docs*"]
exclude = ["artifacts*", "tests*", "scripts*", "docs*", "skills*", "workflows*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
  "network: tests that hit real network (excluded by default)",
]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["artifacts", "scripts/anthropic_content_pipeline.py"]

[tool.ruff.lint]
# Scope for this P0 hardening pass: real errors and unused/missing references.
# Modernization (UP), refactor hints (B, SIM), and import sorting (I) intentionally
# deferred so the diff stays auditable. Re-enable in a follow-up `ruff: modernize`
# pass with `--fix --unsafe-fixes` after the test suite is broader.
select = ["E", "F", "W"]
ignore = [
  "E501",  # line too long: handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "SIM"]
"agent_docs/__init__.py" = ["F401"]
"agent_docs/**/__init__.py" = ["F401"]
